[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosis"
version = "1.1.0"
description = "Genetic algorithm-based HLS requirement mutation and diagnostics"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Gabriel Araujo" },
  { name = "Ricardo Caldas" },
  { name = "Federico Formica"}
]

dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "z3-solver==4.15.4.0",
  "tqdm"
]

[project.optional-dependencies]
# Optional checker (engine='rtamt'). RTAMT 0.3.5 pins the ANTLR 4.7 runtime,
# which is usable on the supported RTAMT test range (Python 3.8--3.12). The
# default Z3 installation remains available on newer Python versions.
rtamt = [
  "rtamt==0.3.5; python_version < '3.13'",
  "antlr4-python3-runtime==4.7; python_version < '3.13'",
]

[project.urls]
"Homepage" = "https://github.com/rdinizcal/Diagnosis"

[project.scripts]
diagnosis = "diagnosis.cli:main"

[tool.setuptools]
packages = ["diagnosis", "diagnosis.lang", "diagnosis.mutation", "diagnosis.diagnostics", "diagnosis.engines"]
[tool.setuptools.package-dir]
diagnosis = "diagnosis"
