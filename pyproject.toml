[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosis"
version = "1.0.0"
description = "Genetic algorithm-based HLS requirement mutation and diagnostics"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Gabriel Araujo" },
  { name = "Ricardo Caldas" },
  { name = "Federico Formica"}
]

dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "z3-solver==4.15.4.0",
  "tqdm"
]

[project.optional-dependencies]
# Optional third checker (engine='rtamt'). Not pulled into the default install;
# the effectiveness/efficiency container ships Z3 only. On Python >= 3.13 the
# antlr4 runtime that rtamt 0.3.5 pins (4.7) fails to import, so a newer runtime
# is required alongside it.
rtamt = [
  "rtamt==0.3.5",
  "antlr4-python3-runtime>=4.9.3",
]

[project.urls]
"Homepage" = "https://github.com/rdinizcal/Diagnosis"

[project.scripts]
diagnosis = "diagnosis.cli:main"

[tool.setuptools]
packages = ["diagnosis", "diagnosis.lang", "diagnosis.mutation", "diagnosis.diagnostics", "diagnosis.engines"]
[tool.setuptools.package-dir]
diagnosis = "diagnosis"